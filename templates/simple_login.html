{% extends "simple_base.html" %}

{% block title %}Login - Project Scheduler{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-danger"></i>
                    Admin Portal
                </h3>
                <p class="text-center text-muted mb-4">Restricted Access (Superusers Only)</p>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Admin Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Secure Login
                    </button>
                </form>

                <div class="mt-4 p-3 rounded">
                    <p class="small text-center mb-2">If you don't have an admin account, run:</p>
                    <p class="small text-center text-muted"><code>python create_superuser.py</code></p>
                </div>
            </div>
        </div>

        <div class="text-center mt-3 text-muted small">
            <p>All data stored locally in Excel files</p>
        </div>
    </div>
</div>
{% endblock %}
