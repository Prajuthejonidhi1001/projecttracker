{% extends "simple_base.html" %}

{% block title %}Error {{ error_code }} - Project Scheduler{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <h1 class="display-1 text-danger">{{ error_code }}</h1>
                <h3 class="mb-4">{{ error_message }}</h3>
                <p class="text-muted mb-4">Something went wrong. Please try again or go back to the dashboard.</p>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
